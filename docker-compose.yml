services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: eventhub
      POSTGRES_PASSWORD: eventhub_dev
      POSTGRES_DB: eventhub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # A fake inbox for development: the API sends email to port 1025 and nothing leaves
  # the machine. Read it at http://localhost:8025.
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # A fake AWS for development (S3 for event images). Console at http://localhost:4566/_floci/ui.
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION}
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Key: ${Jwt__Key}
      Tickets__Secret: ${Tickets__Secret}
      Jwt__Issuer: "EventHub"
      Jwt__Audience: "EventHubUsers"
      Jwt__ExpiryMinutes: "15"
      Smtp__Host: "mailpit"
      Smtp__Port: "1025"
      Smtp__From: "Event Hub <no-reply@eventhub.local>"
      # Presigned URLs are signed here but used by the browser, so the host must be reachable from the host machine.
      S3__ServiceUrl: "http://localhost.floci.io:4566"
      S3__Bucket: "eventhub-images"
      S3__PublicBaseUrl: "http://localhost.floci.io:4566/eventhub-images"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      Stripe__SecretKey: ${Stripe__SecretKey}
      Stripe__WebhookSecret: ${Stripe__WebhookSecret}
    depends_on:
      - postgres
      - redis
      - mailpit
      - floci

volumes:
  pgdata: