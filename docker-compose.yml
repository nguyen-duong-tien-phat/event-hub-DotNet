version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: eventhub
      POSTGRES_PASSWORD: eventhub_dev
      POSTGRES_DB: eventhub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=eventhub;Username=eventhub;Password=eventhub_dev"
      Jwt__Key: "this-is-a-dev-only-secret-key-change-me-later-32chars+"
      Jwt__Issuer: "EventHub"
      Jwt__Audience: "EventHubUsers"
      Jwt__ExpiryMinutes: "60"
    depends_on:
      - postgres

volumes:
  pgdata: