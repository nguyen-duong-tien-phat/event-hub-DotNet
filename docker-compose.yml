services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventhub_dev}
      POSTGRES_DB: ${POSTGRES_DB:-eventhub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    
  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # A fake inbox for development: the API sends email to port 1025 and nothing leaves
  # the machine. Read it at http://localhost:8025.
  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # A fake AWS for development (S3 for event images). Console at http://localhost:4566/_floci/ui.
  # Its data lives in the floci-data volume, so buckets and images survive restarts.
  floci:
    image: floci/floci:latest
    environment:
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    ports:
      - "${FLOCI_PORT:-4566}:4566"
    volumes:
      - floci-data:/app/data
    networks:
      default:
        aliases:
          # The API container reaches Floci by the host name the browser uses (S3__ServiceUrl), so its own
          # S3 calls (deleting a poster) work too. Without this, localhost.floci.io is the container itself.
          - localhost.floci.io

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      # DB_CONNECTION overrides; otherwise it is built from the POSTGRES_* values above.
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION:-Host=postgres;Port=5432;Database=${POSTGRES_DB:-eventhub};Username=${POSTGRES_USER:-eventhub};Password=${POSTGRES_PASSWORD:-eventhub_dev}}
      ConnectionStrings__Redis: "redis:6379"
      Cors__AllowedOrigins: ${Cors__AllowedOrigins:-http://localhost:5173}
      # Swagger UI at /swagger. This stack is for development; set false anywhere that is not.
      Swagger__Enabled: ${Swagger__Enabled:-true}
      # Behind a reverse proxy: its address(es), comma separated. X-Forwarded-For is trusted only from them.
      ForwardedHeaders__KnownProxies: ${ForwardedHeaders__KnownProxies:-}
      ForwardedHeaders__KnownNetworks: ${ForwardedHeaders__KnownNetworks:-}
      Jwt__Issuer: ${Jwt__Issuer:-EventHub}
      Jwt__Audience: ${Jwt__Audience:-EventHubUsers}
      Jwt__ExpiryMinutes: ${Jwt__ExpiryMinutes:-15}
      Jwt__RefreshTokenDays: ${Jwt__RefreshTokenDays:-30}
      # Mailpit by default. Point these at a real SMTP server to send real mail; an empty Smtp__Host logs emails instead.
      Smtp__Host: ${Smtp__Host-mailpit}
      Smtp__Port: ${Smtp__Port:-1025}
      Smtp__From: "${Smtp__From:-Event Hub <no-reply@eventhub.local>}"
      Smtp__User: ${Smtp__User:-}
      Smtp__Password: ${Smtp__Password:-}
      # From .env, defaulting to Floci. Presigned URLs are signed here but used by the browser, so the host
      # must be reachable from the host machine (and from phones, if they load the images).
      S3__ServiceUrl: ${S3__ServiceUrl:-http://localhost.floci.io:4566}
      S3__Bucket: ${S3__Bucket:-eventhub-images}
      S3__PublicBaseUrl: ${S3__PublicBaseUrl:-http://localhost.floci.io:4566/eventhub-images}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Jwt, Tickets and Stripe keys come from this secret in Secrets Manager (Floci), created by infra/secrets.tf.
      Aws__SecretId: ${Aws__SecretId:-eventhub/app}
      # Address of Floci inside the compose network (the .env value, localhost, only works outside Docker).
      Aws__ServiceUrl: "http://floci:4566"
      # Queue that emails go through (created by infra/sqs.tf). Empty: send directly.
      Sqs__EmailQueue: ${Sqs__EmailQueue:-eventhub-email}
      # Retry queues (infra/sqs.tf): a failed Stripe stop/refund and a failed poster delete are tried again.
      Sqs__PaymentRetryQueue: ${Sqs__PaymentRetryQueue:-eventhub-payment-retry}
      Sqs__FileDeleteQueue: ${Sqs__FileDeleteQueue:-eventhub-file-delete}
    depends_on:
      - postgres
      - redis
      - mailpit
      - floci

volumes:
  pgdata:
  floci-data: